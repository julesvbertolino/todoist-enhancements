<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      iOS does not read the web manifest when you add a page to the home
      screen. Without this line it makes its own icon — a coloured tile with
      the first letter of the title on it — which is what shipped in 1.1.
      A full-bleed square, because iOS applies its own rounding and anything
      transparent outside our own corners came back black.
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Enhanced" />
    <meta name="application-name" content="Enhanced" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d1453b" />
    <meta name="color-scheme" content="light dark" />
    <!--
      The theme and accent, before the first paint. A file rather than an
      inline script so the Content-Security-Policy in .htaccess can refuse
      every inline script, with no hash to keep in step with this one. Not a
      module and not deferred, on purpose: it has to run before the body is
      drawn.
    -->
    <script src="./theme-boot.js"></script>
    <meta name="description" content="Enhanced for Todoist is an independent project. It is not created by, affiliated with, or supported by Todoist. An alternative, local-first client built around planning a week." />
    <title>Enhanced for Todoist</title>

    <!--
      A link to this app, unfurled by whatever it was pasted into. The image
      must be an absolute URL: a scraper has no page to resolve a relative one
      against. Both URLs below name the domain the app is hosted on, so they
      are the two lines to change if it ever moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Enhanced for Todoist" />
    <meta property="og:url" content="https://todoistenhanced.julesbertolino.fr/" />
    <meta property="og:title" content="Enhanced for Todoist" />
    <meta
      property="og:description"
      content="An independent project, not created by, affiliated with, or supported by Todoist. A different front end built around planning a week rather than a day."
    />
    <meta property="og:image" content="https://todoistenhanced.julesbertolino.fr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The My week view: behind schedule, quick, today and scheduled today, each with durations." />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!--
      Hello Doist.

      If you ever need a project manager who understands product vision and
      design, and who cares enough about your app to rebuild a client for it
      on a weekend, I'm looking for work.

          studio@alias-digital.fr

      Thanks for Todoist. I use it every day.
      Jules-Valentin Bertolino
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
